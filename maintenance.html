<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Under Maintenance - LeweDesk</title>
  <link rel="icon" href="favicon.ico">
  <!-- Standalone page: no application scripts or styles, so it also works while the app or API is down. -->
  <style>
    :root {
      --bg: #f0f2f5;
      --card: #ffffff;
      --text: #212631;
      --muted: #6b7785;
      --primary: #0d6efd;
      --border: #d8dbe0;
    }
    :root[data-theme="dark"] {
      --bg: #1b1e25;
      --card: #252a33;
      --text: #e3e5e8;
      --muted: #9aa3ae;
      --primary: #0d6efd;
      --border: #3a4150;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.5;
    }
    .card {
      width: 100%;
      max-width: 480px;
      padding: 40px 32px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }
    img { width: 100px; height: 113px; margin-bottom: 24px; }
    h1 { margin: 0 0 12px; font-size: 1.5rem; }
    p { margin: 0; color: var(--muted); }
    .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 28px; }
    .btn {
      padding: 8px 16px;
      font: inherit;
      color: var(--text);
      text-decoration: none;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-primary { color: #fff; background: var(--primary); border-color: var(--primary); }
    .btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <main class="card">
    <img src="assets/img/maintenance.gif" alt="">
    <h1 id="title">Under Maintenance</h1>
    <p id="message">LeweDesk is currently undergoing maintenance. Please try again in a few minutes.</p>
    <div class="actions">
      <button type="button" class="btn btn-primary" id="retry">Try again</button>
      <a href="login.html" class="btn" id="admin-login">Administrator login</a>
    </div>
  </main>
  <script>
    (function () {
      var texts = {
        en: {
          title: 'Under Maintenance',
          message: 'LeweDesk is currently undergoing maintenance. Please try again in a few minutes.',
          retry: 'Try again',
          login: 'Administrator login'
        },
        de: {
          title: 'Wartungsarbeiten',
          message: 'LeweDesk wird gerade gewartet. Bitte versuche es in einigen Minuten erneut.',
          retry: 'Erneut versuchen',
          login: 'Administrator-Anmeldung'
        }
      };

      function stored(key) {
        try { return localStorage.getItem(key); } catch (e) { return null; }
      }

      // Language: the user's choice in the app, otherwise the browser language
      var lang = stored('ldsk_lang') || (navigator.language || 'en').slice(0, 2);
      var t = texts[lang] || texts.en;
      document.documentElement.lang = texts[lang] ? lang : 'en';
      document.getElementById('title').textContent = t.title;
      document.getElementById('message').textContent = t.message;
      document.getElementById('retry').textContent = t.retry;
      document.getElementById('admin-login').textContent = t.login;
      document.title = t.title + ' - LeweDesk';

      // Theme: the user's choice in the app (light, dark, auto), otherwise the system setting
      var theme = stored('theme');
      var dark = theme === 'dark' || ((!theme || theme === 'auto') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.setAttribute('data-theme', 'dark');

      // Return to the application as soon as the maintenance mode is over
      function check() {
        fetch('api/settings?t=' + Date.now())
          .then(function (response) { return response.json(); })
          .then(function (result) {
            if (result.status === 'success' && result.data.under_maintenance !== 'true') {
              window.location.replace('dashboard.html');
            }
          })
          .catch(function () { /* the server may be unreachable during maintenance */ });
      }
      document.getElementById('retry').addEventListener('click', check);
      check();
      setInterval(check, 30000);
    })();
  </script>
</body>
</html>
