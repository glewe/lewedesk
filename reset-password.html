<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      var t = localStorage.getItem('theme') || 'auto';
      if (t === 'auto') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-bs-theme', t);
    })();
  </script>
  

  <title>Reset Password - LeweDesk</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="./assets/img/icons/app-icon-180.png">
  <link rel="manifest" href="./site.webmanifest">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#212631" media="(prefers-color-scheme: dark)">

  <meta name="robots" content="noindex, nofollow">


  <script type="module" crossorigin src="./assets/js/fonts-dgFHIs4h.js"></script>
  <script type="module" crossorigin src="./assets/js/auth-CybMKzm-.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/css/fonts-CZR4NW46.css">
</head>
<body class="auth-page">
  <div class="container d-flex align-items-center min-vh-100">
    <div class="row justify-content-center w-100">
      <div class="col-md-5">
        <div class="card p-4 shadow-sm border-0">
          <div class="card-body">
            <div class="text-center mb-4">
              <i class="bi bi-shield-lock-fill fs-1 text-primary"></i>
              <h1 class="h3 mt-2">Reset Password</h1>
              <p class="text-muted" id="reset-subtitle">Enter your email to receive a reset link</p>
            </div>
            <form id="reset-form">
              <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-transparent"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control" id="email" required placeholder="name@example.com">
                </div>
              </div>
              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary" id="reset-btn">Send Reset Link</button>
                <a href="login.html" class="btn btn-link text-decoration-none">Back to Login</a>
              </div>
            </form>
            <form id="new-password-form" class="d-none">
              <div class="mb-3">
                <label for="new-password" class="form-label">New Password</label>
                <input type="password" class="form-control" id="new-password" required autocomplete="new-password">
              </div>
              <div class="mb-3">
                <label for="confirm-password" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirm-password" required autocomplete="new-password">
              </div>
              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary" id="new-password-btn">Change Password</button>
                <a href="login.html" class="btn btn-link text-decoration-none">Back to Login</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
