<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      var t = localStorage.getItem('theme') || 'auto';
      if (t === 'auto') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-bs-theme', t);
    })();
  </script>
  

  <title>Login - LeweDesk</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="./assets/img/icons/app-icon-180.png">
  <link rel="manifest" href="./site.webmanifest">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#212631" media="(prefers-color-scheme: dark)">

  <meta name="robots" content="noindex, nofollow">


  <script type="module" crossorigin src="./assets/js/fonts-BBofFgIY.js"></script>
  <script type="module" crossorigin src="./assets/js/auth-BLjHDIP1.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/css/fonts-Bkfm3jnF.css">
</head>
<body class="auth-page">
  <div class="container d-flex align-items-center min-vh-100">
    <div class="row justify-content-center w-100">
      <div class="col-md-5">
        <div class="card p-4 shadow-sm border-0">
          <div class="card-body">
            <div class="text-center mb-4">
              <i class="bi bi-ticket-perforated fs-1 logo-gradient"></i>
              <h1 class="h3 mt-2 fw-normal">Lewe<strong>Desk</strong> Login</h1>
              <p class="text-muted">Sign in to your account</p>
            </div>
            <div class="alert alert-warning py-2 small d-none" id="license-notice" role="alert"><i class="bi bi-key me-2"></i><span></span></div>
            <div class="alert alert-info py-2 small d-none" id="ldap-hint" role="status"><i class="bi bi-diagram-3 me-2"></i>LDAP authentication active</div>
            <div class="d-none" id="sso-block">
              <div class="d-grid mb-3">
                <a href="api/auth/oidc/login" class="btn btn-primary btn-lg" id="sso-btn"><i class="bi bi-box-arrow-in-right me-2"></i>Login with SSO</a>
              </div>
              <div class="text-center text-muted small mb-3" id="sso-divider">Administrator login</div>
            </div>
            <form id="login-form">
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <div class="input-group">
                  <span class="input-group-text bg-transparent"><i class="bi bi-person"></i></span>
                  <input type="text" class="form-control" id="username" required>
                </div>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-transparent"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control" id="password" required>
                </div>
              </div>
              <div class="d-grid">
                <button type="submit" class="btn btn-primary" id="login-btn">Login</button>
              </div>
              <div class="text-center mt-3" id="forgot-link-row">
                <a href="reset-password.html" class="text-decoration-none small">Forgot password?</a>
              </div>
            </form>
          </div>
          <div class="card-footer bg-body border-0 text-center py-4" id="signup-footer">
            Don't have an account? <a href="register.html" class="text-decoration-none">Sign up</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
